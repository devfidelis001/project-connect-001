<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Labour Market | Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #031633, #05285a, #0b5ed7, #04162c);
            min-height: 100vh;
            color: #fff;
            padding-bottom: 50px;
        }

        .navbar {
            background: rgba(7, 14, 30, 0.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .admin-card {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 25px;
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 30px;
        }

        .table-custom {
            color: #fff;
            background: transparent;
        }

        .table-custom th {
            background: rgba(13, 110, 253, 0.2);
            color: #4da3ff;
            border-color: rgba(255, 255, 255, 0.1);
        }

        .table-custom td {
            background: transparent;
            border-color: rgba(255, 255, 255, 0.08);
            vertical-align: middle;
        }

        .profile-img-sm {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #4da3ff;
        }

        .badge-role {
            font-size: 0.75rem;
            padding: 4px 8px;
            border-radius: 12px;
        }

        .job-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .job-item:hover {
            background: rgba(255, 255, 255, 0.07);
        }

        .btn-delete-job,
        .btn-delete-user {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 6px 14px;
            font-size: 0.85rem;
            transition: 0.2s;
        }

        .btn-delete-job:hover,
        .btn-delete-user:hover {
            background: #bb2d3b;
        }

        .search-admin {
            background: #132847;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 20px;
            padding: 8px 16px;
        }

        .search-admin:focus {
            background: #18355d;
            color: white;
            box-shadow: none;
            border-color: #4da3ff;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg sticky-top mb-4">
        <div class="container-fluid px-4">
            <a class="navbar-brand d-flex align-items-center gap-2" href="#">
                <img src="images/LIGHT MARKET.png" style="height:50px;" alt="Logo" onerror="this.style.display='none'">
                <span class="fw-bold fs-4 text-light">Admin Portal</span>
            </a>
            <div class="ms-auto d-flex gap-2">
                <a href="home.html" class="btn btn-outline-light btn-sm rounded-pill px-3 d-flex align-items-center">
                    <i class="bi bi-house-door-fill me-1"></i> Go to Live Home Page
                </a>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <!-- STATS DASHBOARD HEADER -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="admin-card d-flex align-items-center justify-content-between py-3 mb-2">
                    <div>
                        <h6 class="text-secondary mb-1">Total Posted Jobs</h6>
                        <h2 class="mb-0 text-primary fw-bold" id="totalJobsCount">0</h2>
                    </div>
                    <i class="bi bi-briefcase-fill fs-1 text-primary"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card d-flex align-items-center justify-content-between py-3 mb-2">
                    <div>
                        <h6 class="text-secondary mb-1">Total Registered Users</h6>
                        <h2 class="mb-0 text-info fw-bold" id="totalUsersCount">0</h2>
                    </div>
                    <i class="bi bi-people-fill fs-1 text-info"></i>
                </div>
            </div>
            <div class="col-md-4">
                <div class="admin-card d-flex align-items-center justify-content-between py-3 mb-2">
                    <div>
                        <h6 class="text-secondary mb-1">Active Job Posters</h6>
                        <h2 class="mb-0 text-warning fw-bold" id="totalPostersCount">0</h2>
                    </div>
                    <i class="bi bi-person-badge-fill fs-1 text-warning"></i>
                </div>
            </div>
        </div>

        <!-- NEW USER SIGNUPS TABLE -->
        <div class="admin-card">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="mb-0"><i class="bi bi-person-check-fill text-info me-2"></i>New User Signups</h4>
                <div class="d-flex gap-2">
                    <input type="text" id="userSearchInput" class="search-admin form-control-sm" placeholder="Search user..." onkeyup="filterUsers()">
                    <button class="btn btn-sm btn-outline-info rounded-pill" onclick="loadUsers()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-custom align-middle">
                    <thead>
                        <tr>
                            <th>User</th>
                            <th>Role / Classification</th>
                            <th>Phone</th>
                            <th>Location</th>
                            <th>Signed Up Date</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-secondary py-4">Loading user signups...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ALL POSTED JOBS MANAGEMENT LIST -->
        <div class="admin-card">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
                <h4 class="mb-0"><i class="bi bi-journal-text text-primary me-2"></i>All Posted Jobs Management</h4>
                <div class="d-flex gap-2">
                    <input type="text" id="jobSearchInput" class="search-admin form-control-sm" placeholder="Search title or company..." onkeyup="filterJobs()">
                    <button class="btn btn-sm btn-outline-primary rounded-pill" onclick="loadJobs()"><i class="bi bi-arrow-clockwise"></i> Refresh</button>
                </div>
            </div>
            <div id="jobsContainer">
                <div class="text-center text-secondary py-4">Loading job postings...</div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_BASE = 'https://project-connect-001.onrender.com';
        const DEFAULT_AVATAR = 'https://images.pexels.com/photos/220453/pexels-photo-220453.jpeg';

        let cachedUsers = [];
        let cachedJobs = [];

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        // FETCH & RENDER USERS
        function loadUsers() {
            const tbody = document.getElementById('usersTableBody');
            fetch(`${API_BASE}/admin/users`)
                .then(res => {
                    if (!res.ok) return fetch(`${API_BASE}/users`).then(r => r.json());
                    return res.json();
                })
                .then(users => {
                    cachedUsers = Array.isArray(users) ? users : [];
                    renderUsersTable(cachedUsers);
                })
                .catch(err => {
                    console.error('Error fetching users:', err);
                    tbody.innerHTML = `<tr><td colspan="6" class="text-center text-danger py-4">Failed to load user signup data.</td></tr>`;
                });
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('usersTableBody');
            if (users.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center text-secondary py-4">No registered users found.</td></tr>`;
                document.getElementById('totalUsersCount').textContent = '0';
                document.getElementById('totalPostersCount').textContent = '0';
                return;
            }

            document.getElementById('totalUsersCount').textContent = users.length;
            
            const posterCount = users.filter(u => u.role && u.role.toLowerCase().includes('poster')).length;
            document.getElementById('totalPostersCount').textContent = posterCount;

            tbody.innerHTML = users.map(user => {
                const avatar = user.avatar || DEFAULT_AVATAR;
                const role = user.role || 'Jobseeker';
                const badgeClass = role.toLowerCase().includes('poster') ? 'bg-warning text-dark' : 'bg-primary';
                const dateStr = user.createdAt ? new Date(user.createdAt).toLocaleDateString() : 'Recent';
                const userId = user.id || user._id || user.email;

                return `
                    <tr id="admin-user-${escapeHtml(userId)}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <img src="${escapeHtml(avatar)}" class="profile-img-sm" alt="User">
                                <div>
                                    <div class="fw-semibold">${escapeHtml(user.name || 'Anonymous User')}</div>
                                    <small class="text-secondary">${escapeHtml(user.email || 'No email provided')}</small>
                                </div>
                            </div>
                        </td>
                        <td><span class="badge badge-role ${badgeClass}">${escapeHtml(role)}</span></td>
                        <td>${escapeHtml(user.phone || 'N/A')}</td>
                        <td>${escapeHtml(user.location || 'N/A')}</td>
                        <td><small class="text-secondary">${dateStr}</small></td>
                        <td class="text-end">
                            <button class="btn-delete-user" onclick="deleteUser('${escapeHtml(userId)}')">
                                <i class="bi bi-person-x-fill me-1"></i> Delete User
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function filterUsers() {
            const term = document.getElementById('userSearchInput').value.toLowerCase();
            const filtered = cachedUsers.filter(u => 
                (u.name && u.name.toLowerCase().includes(term)) ||
                (u.email && u.email.toLowerCase().includes(term)) ||
                (u.role && u.role.toLowerCase().includes(term))
            );
            renderUsersTable(filtered);
        }

        // DELETE USER DIRECTLY FROM SERVER
        function deleteUser(userId) {
            if (!confirm('Are you sure you want to delete this user account? This action cannot be undone.')) {
                return;
            }

            fetch(`${API_BASE}/admin/users/${encodeURIComponent(userId)}`, {
                method: 'DELETE'
            })
            .then(res => {
                if (!res.ok) {
                    // Fallback to secondary endpoint if primary /admin/users route is not configured
                    return fetch(`${API_BASE}/users/${encodeURIComponent(userId)}`, { method: 'DELETE' });
                }
                return res;
            })
            .then(res => {
                if (!res.ok) throw new Error('User deletion failed');
                cachedUsers = cachedUsers.filter(u => String(u.id || u._id || u.email) !== String(userId));
                renderUsersTable(cachedUsers);
            })
            .catch(err => {
                console.error('Error deleting user:', err);
                alert('Could not remove user from server. Please try again.');
            });
        }

        // FETCH & RENDER JOBS
        function loadJobs() {
            const container = document.getElementById('jobsContainer');
            fetch(`${API_BASE}/jobs`)
                .then(res => res.json())
                .then(jobs => {
                    cachedJobs = Array.isArray(jobs) ? jobs : [];
                    renderJobsList(cachedJobs);
                })
                .catch(err => {
                    console.error('Error fetching jobs:', err);
                    container.innerHTML = `<div class="text-center text-danger py-4">Failed to fetch job postings from backend.</div>`;
                });
        }

        function renderJobsList(jobs) {
            const container = document.getElementById('jobsContainer');
            if (jobs.length === 0) {
                container.innerHTML = `<div class="text-center text-secondary py-4">No posted jobs found.</div>`;
                document.getElementById('totalJobsCount').textContent = '0';
                return;
            }

            document.getElementById('totalJobsCount').textContent = jobs.length;
            container.innerHTML = jobs.map(job => {
                return `
                    <div class="job-item" id="admin-job-${job.id}">
                        <div>
                            <h5 class="mb-1">${escapeHtml(job.title)}</h5>
                            <p class="mb-0 text-secondary small">
                                <strong>Company:</strong> ${escapeHtml(job.company)} | 
                                <strong>Location:</strong> ${escapeHtml(job.location || 'N/A')} | 
                                <strong>ID:</strong> ${escapeHtml(job.id)}
                            </p>
                        </div>
                        <button class="btn-delete-job" onclick="deleteJob('${job.id}')">
                            <i class="bi bi-trash-fill me-1"></i> Delete Job
                        </button>
                    </div>
                `;
            }).join('');
        }

        function filterJobs() {
            const term = document.getElementById('jobSearchInput').value.toLowerCase();
            const filtered = cachedJobs.filter(j => 
                (j.title && j.title.toLowerCase().includes(term)) ||
                (j.company && j.company.toLowerCase().includes(term))
            );
            renderJobsList(filtered);
        }

        // DELETE JOB DIRECTLY FROM SERVER
        function deleteJob(jobId) {
            if (!confirm('Are you sure you want to permanently delete this job? It will be automatically removed from all user feeds.')) {
                return;
            }

            fetch(`${API_BASE}/jobs/${encodeURIComponent(jobId)}`, {
                method: 'DELETE'
            })
            .then(res => {
                if (!res.ok) throw new Error('Deletion failed');
                cachedJobs = cachedJobs.filter(j => String(j.id) !== String(jobId));
                renderJobsList(cachedJobs);
            })
            .catch(err => {
                console.error('Error deleting job:', err);
                alert('Could not remove job from server. Please try again.');
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadUsers();
            loadJobs();
        });
    </script>

</body>
</html>
